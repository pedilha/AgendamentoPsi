<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Meus Bloqueios</title>
</head>
<body>
    <h1>Meus Bloqueios</h1>

    <table>
        <thead>
            <tr>
                <th>Data</th>
                <th>Início</th>
                <th>Fim</th>
                <th>Motivo</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="b : ${bloqueios}">
                <td th:text="${b.data}"></td>
                <td th:text="${b.horaInicio}"></td>
                <td th:text="${b.horaFim}"></td>
                <td th:text="${b.motivo}"></td>
                <td>
                    <a th:href="@{/psicologo/bloqueio/{id}/editar(id=${b.id})}">Editar</a>
                    <form th:action="@{/psicologo/bloqueio/{id}/excluir(id=${b.id})}" method="post" style="display:inline"
                        onsubmit="return confirm('Tem certeza que deseja excluir este bloqueio?');">
                        <button type="submit">Excluir</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <p th:if="${bloqueios.isEmpty()}">Nenhum bloqueio cadastrado ainda.</p>
</body>
</html>
